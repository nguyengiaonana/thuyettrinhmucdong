<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lễ hội Mục đồng làng Phong Lệ (Đà Nẵng) — Trình chiếu 31 Slide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-pearl: #FDFBF7;
      --bg-sand: #F5EFEB;
      --bg-sand-deep: #EDE3D8;
      --glass-card: rgba(255, 255, 255, 0.90);
      --glass-soft: rgba(250, 245, 238, 0.86);
      --border-warm: rgba(212, 154, 61, 0.30);
      --border-subtle: #E6DBD0;
      --border-strong: #D4C3B0;

      --text-primary: #1A1A1A;
      --text-chestnut: #2A1A0A;
      --text-muted: #5A4738;
      --text-subtle: #745F4F;

      --accent-gold: #D49A3D;
      --accent-gold-dark: #8F6012;
      --accent-gold-bg: #FCF4E4;

      --accent-vermilion: #B83A2C;
      --accent-vermilion-dark: #8F281D;
      --accent-vermilion-bg: #FAEDEB;

      --accent-moss: #3E5638;
      --accent-moss-bg: #EDF3EB;

      --shadow-card: 0 12px 32px -12px rgba(42, 26, 10, 0.11), 0 2px 6px rgba(42, 26, 10, 0.05);
      --shadow-photo: 0 18px 40px -14px rgba(42, 26, 10, 0.22), 0 4px 12px rgba(42, 26, 10, 0.08);
      --shadow-stage: 0 24px 60px -18px rgba(42, 26, 10, 0.18), 0 4px 14px rgba(42, 26, 10, 0.06);
      --glow-gold: 0 0 0 2px #D49A3D, 0 0 30px rgba(212, 154, 61, 0.34), 0 16px 36px -14px rgba(42, 26, 10, 0.20);

      --radius-photo: 16px;
      --radius-video: 16px;
      --radius-card: 16px;
      --radius-stage: 18px;
      --radius-pill: 999px;

      --font-sans: 'Be Vietnam Pro', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      font-family: var(--font-sans);
      background-color: var(--bg-sand);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    body {
      background-image:
        radial-gradient(circle at 10% 15%, rgba(212, 154, 61, 0.14), transparent 38%),
        radial-gradient(circle at 90% 85%, rgba(184, 58, 44, 0.08), transparent 40%),
        linear-gradient(160deg, #F5EFEB 0%, #EFE5DA 100%);
      display: flex;
      flex-direction: column;
    }

    :focus-visible { outline: 3px solid var(--accent-vermilion); outline-offset: 2px; }
    button { font-family: inherit; cursor: pointer; border: none; background: transparent; color: inherit; }
    a { color: var(--accent-vermilion); text-decoration: underline; text-underline-offset: 3px; }

    /* TOP BAR — ALWAYS VISIBLE FROSTED GLASS HEADER, SPLIT TWO-SIDE LAYOUT */
    .top-bar {
      position: relative;
      height: 52px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(253, 251, 247, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 195, 176, 0.58);
      box-shadow: 0 2px 10px rgba(42, 26, 10, 0.05);
      z-index: 40;
      flex-shrink: 0;
    }

    .top-left, .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 13px 4px 6px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      box-shadow: 0 2px 8px rgba(42, 26, 10, 0.05);
      flex-shrink: 0;
    }
    .brand-dot {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--accent-vermilion); color: #FDFBF7;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .brand-title { font-size: 13.5px; font-weight: 700; color: var(--text-chestnut); white-space: nowrap; }

    .icon-btn {
      min-width: 38px; height: 36px; padding: 0 12px; border-radius: 10px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border-subtle); color: var(--text-chestnut);
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 12.5px; font-weight: 600; white-space: nowrap;
      transition: background-color 180ms var(--ease), border-color 180ms var(--ease), color 180ms var(--ease), transform 180ms var(--ease), box-shadow 180ms var(--ease);
      box-shadow: 0 2px 6px rgba(42, 26, 10, 0.04);
    }
    .icon-btn:hover { background: #FFFFFF; border-color: var(--accent-gold); color: var(--accent-vermilion); }
    .icon-btn.active { background: var(--text-chestnut); border-color: var(--text-chestnut); color: #FDFBF7; }
    .icon-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* PROMINENT PRESENT BUTTON AT TOP-RIGHT */
    .icon-btn.btn-present {
      height: 38px;
      padding: 0 17px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent-vermilion) 0%, var(--accent-vermilion-dark) 100%);
      border: 1px solid rgba(212, 154, 61, 0.65);
      color: #FDFBF7;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.01em;
      box-shadow: 0 6px 16px rgba(184, 58, 44, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }
    .icon-btn.btn-present:hover {
      background: linear-gradient(135deg, #C74233 0%, var(--accent-vermilion) 100%);
      border-color: var(--accent-gold);
      color: #FFFFFF;
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(184, 58, 44, 0.34);
    }
    .icon-btn.btn-present.active {
      background: linear-gradient(135deg, #2A1A0A 0%, #442A13 100%);
      border-color: var(--accent-gold);
      color: #FDFBF7;
    }

    /* STAGE & FULL-SCREEN RESPONSIVE SLIDE FRAME (TRUE 96vw / 92vh EXPANSION) */
    .stage-wrapper {
      flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
      padding: 6px 14px 10px; overflow: hidden; position: relative;
    }
    .slide-viewport {
      width: 96vw; height: 100%; max-height: 92vh;
      display: flex; align-items: center; justify-content: center;
    }

    .slide-frame {
      width: 1440px; height: 810px;
      background:
        radial-gradient(circle at 86% 12%, rgba(212, 154, 61, 0.12), transparent 36%),
        radial-gradient(circle at 12% 92%, rgba(245, 239, 235, 0.95), transparent 50%),
        linear-gradient(155deg, #FDFBF7 0%, #F5EFEB 100%);
      border-radius: var(--radius-stage);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-stage);
      position: relative; overflow: hidden; transform-origin: center center;
      flex-shrink: 0; display: flex; flex-direction: column;
    }
    .slide-frame::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
      background: linear-gradient(90deg, var(--accent-vermilion) 0%, var(--accent-gold) 65%, #E7C278 100%);
      z-index: 6;
    }

    .slide-content {
      flex: 1; min-height: 0; padding: 30px 46px 22px;
      display: flex; flex-direction: column; position: relative; z-index: 2;
      animation: slideReveal 240ms var(--ease);
    }
    @keyframes slideReveal { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }

    .slide-footer-bar {
      height: 36px; padding: 0 46px;
      border-top: 1px solid rgba(212, 195, 176, 0.55);
      background: rgba(245, 239, 235, 0.72);
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; font-weight: 600; color: var(--text-subtle); z-index: 2;
    }
    .slide-num-badge { color: var(--accent-vermilion); font-weight: 800; letter-spacing: 0.05em; }

    /* HEADER & LARGE PROJECTOR-READY TYPOGRAPHY */
    .slide-header { margin-bottom: 18px; display: flex; flex-direction: column; gap: 7px; }
    .eyebrow-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .tag-pill {
      display: inline-flex; align-items: center; gap: 7px; padding: 6px 15px;
      border-radius: var(--radius-pill); font-size: 1.05rem; font-weight: 800;
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .tag-pill.vermilion { background: var(--accent-vermilion-bg); color: var(--accent-vermilion-dark); border: 1px solid rgba(184, 58, 44, 0.25); }
    .tag-pill.gold { background: var(--accent-gold-bg); color: var(--accent-gold-dark); border: 1px solid rgba(212, 154, 61, 0.48); }
    .tag-pill.moss { background: var(--accent-moss-bg); color: var(--accent-moss); border: 1px solid rgba(62, 86, 56, 0.26); }

    .slide-index-tag { font-size: 1.05rem; font-weight: 800; color: var(--accent-gold-dark); letter-spacing: 0.05em; }
    .slide-title { font-size: 2.3rem; line-height: 1.16; font-weight: 800; color: var(--text-chestnut); text-transform: uppercase; letter-spacing: -0.015em; }
    .slide-subtitle { font-size: 1.15rem; line-height: 1.52; color: var(--text-muted); font-weight: 500; max-width: 1080px; }

    /* BENTO CARD SYSTEM */
    .bento-card {
      background: var(--glass-card); backdrop-filter: blur(10px);
      border: 1px solid var(--border-subtle); border-radius: var(--radius-card);
      padding: 20px 24px; box-shadow: var(--shadow-card);
      position: relative; display: flex; flex-direction: column;
    }
    .bento-card.soft { background: var(--glass-soft); }
    .bento-card.dark-chestnut {
      background: linear-gradient(145deg, #2A1A0A 0%, #422A14 100%);
      border-color: rgba(212, 154, 61, 0.42); color: #FDFBF7;
    }
    .bento-card.accent-gold { border-left: 5px solid var(--accent-gold); }
    .bento-card.accent-vermilion { border-left: 5px solid var(--accent-vermilion); }
    .bento-card.accent-moss { border-left: 5px solid var(--accent-moss); }
    .bento-card.top-gold { border-top: 4px solid var(--accent-gold); }
    .bento-card.top-vermilion { border-top: 4px solid var(--accent-vermilion); }
    .bento-card.top-moss { border-top: 4px solid var(--accent-moss); }

    .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .card-icon {
      width: 42px; height: 42px; border-radius: 12px;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .card-icon.gold { background: var(--accent-gold-bg); color: var(--accent-gold-dark); }
    .card-icon.vermilion { background: var(--accent-vermilion-bg); color: var(--accent-vermilion); }
    .card-icon.moss { background: var(--accent-moss-bg); color: var(--accent-moss); }
    .card-icon.chestnut { background: #EFE6DB; color: var(--text-chestnut); }
    .card-icon svg { width: 22px; height: 22px; }

    .card-title { font-size: 1.32rem; font-weight: 800; color: var(--text-chestnut); line-height: 1.3; }
    .card-text { font-size: 1.18rem; line-height: 1.6; color: var(--text-primary); }
    .card-text strong { color: var(--text-chestnut); font-weight: 700; }
    .card-muted { font-size: 1.08rem; line-height: 1.55; color: var(--text-muted); }
    .kw { color: var(--accent-vermilion-dark); font-weight: 700; }

    .bullet-list { list-style: none; display: flex; flex-direction: column; gap: 11px; }
    .bullet-item { display: flex; align-items: flex-start; gap: 11px; font-size: 1.16rem; line-height: 1.6; color: var(--text-primary); }
    .bullet-mark {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--accent-gold-bg); color: var(--accent-gold-dark);
      display: grid; place-items: center; flex-shrink: 0; margin-top: 4px;
    }
    .bullet-mark.vermilion { background: var(--accent-vermilion-bg); color: var(--accent-vermilion); }
    .bullet-mark.moss { background: var(--accent-moss-bg); color: var(--accent-moss); }
    .bullet-mark svg { width: 13px; height: 13px; }

    /* PHOTO CARD & GALLERY TILES (FULL-HEIGHT STRETCH, MIN-HEIGHT 420px, 16px RADIUS) */
    .photo-card {
      background: var(--glass-card); border: 1.5px solid var(--border-warm);
      border-radius: 20px; padding: 12px; box-shadow: var(--shadow-photo);
      display: flex; flex-direction: column; gap: 9px; height: 100%; min-height: 0;
    }
    .photo-frame {
      flex: 1; min-height: 420px; width: 100%; height: 100%; border-radius: var(--radius-photo);
      overflow: hidden; background: var(--bg-sand-deep); position: relative;
      border: 1px solid rgba(42, 26, 10, 0.08);
    }
    .photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-badge {
      position: absolute; top: 12px; left: 12px; padding: 5px 12px;
      border-radius: var(--radius-pill); background: rgba(42, 26, 10, 0.84);
      backdrop-filter: blur(6px); color: #FDFBF7; font-size: 0.82rem; font-weight: 700;
      letter-spacing: 0.04em;
    }
    .photo-caption {
      font-size: 0.92rem; line-height: 1.4; color: var(--text-muted); font-weight: 600;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px;
    }
    .photo-caption .source { color: var(--accent-gold-dark); font-weight: 700; white-space: nowrap; }
    .compact-photo .photo-frame { min-height: 300px; }

    /* INTERACTIVE STEPPER (POWERPOINT SUB-STEP + DIRECT CARD CLICK + SYNCED PHOTO) */
    .stepper-layout {
      display: grid;
      grid-template-columns: 45% 1fr;
      gap: 24px;
      flex: 1;
      min-height: 0;
      align-items: stretch;
    }
    .stepper-layout.ratio-50-50 {
      grid-template-columns: 1fr 1fr;
    }
    .stepper-col {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .stepper-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
      flex: 1;
      justify-content: center;
      min-height: 0;
    }
    .stepper-card {
      width: 100%;
      text-align: left;
      background: var(--glass-soft);
      border: 1.5px solid var(--border-subtle);
      border-radius: 14px;
      padding: 13px 16px;
      box-shadow: 0 4px 12px -6px rgba(42, 26, 10, 0.08);
      display: flex;
      flex-direction: column;
      gap: 4px;
      opacity: 0.84;
      transition: border-color 200ms var(--ease), background-color 200ms var(--ease), opacity 200ms var(--ease), box-shadow 200ms var(--ease);
    }
    .stepper-card:hover {
      opacity: 1;
      border-color: var(--accent-gold);
      background: #FFFFFF;
    }
    .stepper-card.active {
      opacity: 1;
      background: #FFFDF8;
      border: 2.5px solid var(--accent-gold);
      box-shadow: 0 0 0 3px rgba(212, 154, 61, 0.20), var(--shadow-card);
    }
    .stepper-card-tag {
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent-gold-dark);
    }
    .stepper-card.active .stepper-card-tag {
      color: var(--accent-vermilion);
    }
    .stepper-card-title {
      font-size: 1.24rem;
      font-weight: 800;
      color: var(--text-chestnut);
      line-height: 1.28;
    }
    .stepper-card-desc {
      font-size: 1.08rem;
      line-height: 1.54;
      color: var(--text-primary);
    }
    .stepper-media-stage {
      position: relative;
      height: 100%;
      min-height: 0;
    }
    .stepper-media-item {
      display: none;
      height: 100%;
      animation: tabFade 260ms var(--ease);
    }
    .stepper-media-item.active {
      display: block;
    }

    /* LAYOUT GRIDS */
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; flex: 1; min-height: 0; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; flex: 1; min-height: 0; }
    .split-50-50 { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; flex: 1; min-height: 0; align-items: stretch; }
    .split-55-45 { display: grid; grid-template-columns: 1.18fr 1fr; gap: 26px; flex: 1; min-height: 0; align-items: stretch; }
    .split-45-55 { display: grid; grid-template-columns: 0.92fr 1.08fr; gap: 26px; flex: 1; min-height: 0; align-items: stretch; }
    .split-65-35 { display: grid; grid-template-columns: 65% 1fr; gap: 26px; flex: 1; min-height: 0; align-items: center; }
    .stack { display: flex; flex-direction: column; gap: 15px; justify-content: center; min-height: 0; }

    /* HERO & CHIPS */
    .hero-title { font-size: 3.1rem; line-height: 1.12; font-weight: 800; color: var(--text-chestnut); text-transform: uppercase; letter-spacing: -0.02em; margin: 14px 0 14px; }
    .hero-title span { color: var(--accent-vermilion); }
    .hero-lead { font-size: 1.25rem; line-height: 1.6; color: var(--text-muted); font-weight: 500; margin-bottom: 22px; }
    .team-chip-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: var(--radius-pill); font-size: 0.9rem; font-weight: 700; }
    .chip.sand { background: var(--bg-sand); color: var(--text-chestnut); border: 1px solid var(--border-subtle); }
    .chip.gold { background: var(--accent-gold-bg); color: var(--accent-gold-dark); border: 1px solid rgba(212, 154, 61, 0.45); }
    .chip.vermilion { background: var(--accent-vermilion-bg); color: var(--accent-vermilion-dark); border: 1px solid rgba(184, 58, 44, 0.25); }
    .chip.moss { background: var(--accent-moss-bg); color: var(--accent-moss); border: 1px solid rgba(62, 86, 56, 0.25); }

    /* SLIDE 2: VERTICAL 9:16 TEAM VIDEO + 6 MEMBERS */
    .team-video-grid { display: grid; grid-template-columns: 360px 1fr; gap: 28px; flex: 1; min-height: 0; align-items: center; }
    .video-vertical-stage { display: flex; align-items: center; justify-content: center; height: 100%; }
    .video-vertical-frame {
      height: 580px; width: 326px; aspect-ratio: 9 / 16;
      border-radius: var(--radius-video);
      background: linear-gradient(155deg, #2A1A0A 0%, #3F2712 58%, #211408 100%);
      box-shadow: var(--glow-gold); position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 20px; text-align: center; color: #FDFBF7;
    }
    .video-vertical-frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 15px; z-index: 3; background: #1A1A1A; }
    .video-ratio-tag {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      padding: 5px 14px; border-radius: var(--radius-pill);
      background: rgba(212, 154, 61, 0.22); border: 1px solid rgba(212, 154, 61, 0.65);
      color: #F4C86C; font-size: 0.8rem; font-weight: 800; letter-spacing: 0.06em; white-space: nowrap; z-index: 2;
    }
    .video-play-ring {
      width: 66px; height: 66px; border-radius: 50%;
      background: rgba(212, 154, 61, 0.22); border: 2px solid var(--accent-gold);
      color: #F4C86C; display: grid; place-items: center; margin-bottom: 18px; z-index: 2;
    }
    .video-placeholder-text { font-size: 1.02rem; font-weight: 700; line-height: 1.56; color: #FDFBF7; z-index: 2; }
    .video-placeholder-sub { margin-top: 14px; font-size: 0.88rem; line-height: 1.45; color: #E7D6BE; z-index: 2; }

    .members-bento-card {
      background: var(--glass-card); backdrop-filter: blur(10px);
      border: 1.5px solid var(--border-subtle); border-radius: 18px;
      padding: 22px 24px; box-shadow: var(--shadow-card);
      display: flex; flex-direction: column; justify-content: space-between; gap: 11px; height: 580px;
    }
    .member-row {
      display: flex; align-items: center; gap: 14px; padding: 12px 16px;
      border-radius: 12px; background: rgba(245, 239, 235, 0.78);
      border: 1px solid rgba(212, 154, 61, 0.24);
    }
    .member-num {
      width: 32px; height: 32px; border-radius: 9px; background: var(--accent-vermilion);
      color: #FDFBF7; font-size: 0.95rem; font-weight: 800; display: grid; place-items: center; flex-shrink: 0;
    }
    .member-num.gold { background: var(--accent-gold); color: #2A1A0A; }
    .member-info { font-size: 1.14rem; line-height: 1.45; color: var(--text-primary); }
    .member-info strong { color: var(--text-chestnut); font-weight: 800; }

    /* INTERACTIVE TAB SWITCHER (SLIDES 10 & 22) */
    .tab-switcher-wrap { display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 0; }
    .tab-bar {
      display: inline-flex; align-self: flex-start; gap: 6px; padding: 6px;
      background: var(--bg-sand-deep); border: 1px solid var(--border-subtle);
      border-radius: 14px;
    }
    .tab-btn {
      min-height: 46px; padding: 9px 20px; border-radius: 10px;
      font-size: 1.05rem; font-weight: 700; color: var(--text-muted);
      display: inline-flex; align-items: center; gap: 8px;
      transition: background-color 200ms var(--ease), color 200ms var(--ease), box-shadow 200ms var(--ease);
    }
    .tab-btn:hover { color: var(--text-chestnut); background: rgba(255, 255, 255, 0.55); }
    .tab-btn.active {
      background: var(--text-chestnut); color: #FDFBF7;
      box-shadow: 0 6px 16px -6px rgba(42, 26, 10, 0.35);
    }
    .tab-panel { display: none; flex: 1; min-height: 0; animation: tabFade 240ms var(--ease); }
    .tab-panel.active { display: grid; grid-template-columns: 1fr 1.05fr; gap: 24px; align-items: stretch; }
    @keyframes tabFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* SLIDE 3: BALANCED BENTO GRID (3 EQUAL-HEIGHT REASON CARDS + HERITAGE PHOTO) & CONTINUOUS 5-STAGE TIMELINE */
    .slide3-upper {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 24px;
      flex: 1;
      min-height: 0;
      align-items: stretch;
    }
    .slide3-upper .photo-frame {
      min-height: 0;
      height: 100%;
      border-radius: 16px;
    }
    .reason-grid {
      display: grid;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 14px;
      height: 100%;
      min-height: 0;
    }
    .reason-card {
      background: linear-gradient(155deg, #FFFFFF 0%, #FAF5EE 100%);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 10px 26px -12px rgba(42, 26, 10, 0.14), 0 2px 6px rgba(42, 26, 10, 0.05);
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 0;
    }
    .reason-card.accent-vermilion { border-left: 5px solid var(--accent-vermilion); }
    .reason-card.accent-gold { border-left: 5px solid var(--accent-gold); }
    .reason-card.accent-moss { border-left: 5px solid var(--accent-moss); }
    .reason-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .reason-icon.vermilion { background: var(--accent-vermilion-bg); color: var(--accent-vermilion); border: 1px solid rgba(184, 58, 44, 0.22); }
    .reason-icon.gold { background: var(--accent-gold-bg); color: var(--accent-gold-dark); border: 1px solid rgba(212, 154, 61, 0.36); }
    .reason-icon.moss { background: var(--accent-moss-bg); color: var(--accent-moss); border: 1px solid rgba(62, 86, 56, 0.24); }
    .reason-icon svg { width: 24px; height: 24px; }
    .reason-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .reason-card-title { font-size: 1.24rem; font-weight: 800; color: var(--text-chestnut); line-height: 1.25; }
    .reason-card-desc { font-size: 1.08rem; line-height: 1.5; color: var(--text-primary); }

    /* CONTINUOUS 5-STAGE PROCESS STEPPER TIMELINE */
    .roadmap-timeline {
      margin-top: 18px;
      margin-bottom: 10px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
    }
    .timeline-step {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 7px 10px;
      border-radius: 10px;
      text-align: left;
      transition: background-color 180ms var(--ease), transform 180ms var(--ease);
    }
    .timeline-step:hover {
      background: var(--bg-sand);
      transform: translateY(-1px);
    }
    .timeline-num {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.92rem;
      font-weight: 800;
      flex-shrink: 0;
      letter-spacing: 0.02em;
      box-shadow: 0 4px 10px -4px rgba(42, 26, 10, 0.28);
    }
    .timeline-num.vermilion { background: var(--accent-vermilion); color: #FDFBF7; }
    .timeline-num.gold { background: var(--accent-gold); color: #2A1A0A; }
    .timeline-meta { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .timeline-kicker { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent-vermilion); }
    .timeline-step.tone-gold .timeline-kicker { color: var(--accent-gold-dark); }
    .timeline-step-title { font-size: 0.98rem; font-weight: 800; color: var(--text-chestnut); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .timeline-step-range { font-size: 0.78rem; font-weight: 600; color: var(--text-subtle); }
    .timeline-connector {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      width: 28px;
      color: var(--accent-gold-dark);
    }
    .timeline-connector::before {
      content: "";
      flex: 1;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent-vermilion), var(--accent-gold));
    }
    .timeline-connector svg { width: 14px; height: 14px; margin-left: -4px; flex-shrink: 0; }

    .verse-box { background: var(--glass-card); border: 1px solid var(--border-subtle); border-left: 6px solid var(--accent-gold); border-radius: 18px; padding: 22px 24px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; justify-content: center; gap: 8px; }
    .verse-box.vermilion { border-left-color: var(--accent-vermilion); }
    .verse-quote { font-size: 21px; font-weight: 700; font-style: italic; color: var(--text-chestnut); line-height: 1.42; }

    /* SLIDE 21 MINI QUIZ */
    .quiz-wrap { display: flex; flex-direction: column; gap: 15px; flex: 1; justify-content: center; }
    .quiz-prompt-card {
      background: linear-gradient(135deg, #2A1A0A 0%, #442A13 100%);
      border: 1.5px solid rgba(212, 154, 61, 0.55); border-radius: 18px;
      padding: 20px 26px; color: #FDFBF7; display: flex; align-items: center; gap: 18px; box-shadow: var(--shadow-card);
    }
    .quiz-badge-icon {
      width: 50px; height: 50px; border-radius: 14px; background: rgba(212, 154, 61, 0.22);
      border: 1.5px solid var(--accent-gold); color: #F4C86C; display: grid; place-items: center; flex-shrink: 0;
    }
    .quiz-prompt-text { font-size: 1.5rem; font-weight: 700; line-height: 1.38; }
    .quiz-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .quiz-btn {
      min-height: 84px; background: var(--glass-card); border: 2px solid var(--border-subtle);
      border-radius: 16px; padding: 16px 20px; display: flex; align-items: center; gap: 15px;
      text-align: left; box-shadow: var(--shadow-card);
      transition: border-color 200ms var(--ease), background-color 200ms var(--ease), box-shadow 200ms var(--ease);
    }
    .quiz-btn:hover { border-color: var(--accent-gold); background: #FFFFFF; }
    .quiz-letter {
      width: 42px; height: 42px; border-radius: 11px; background: var(--bg-sand);
      color: var(--text-chestnut); font-size: 1.1rem; font-weight: 800; display: grid; place-items: center; flex-shrink: 0;
    }
    .quiz-label { font-size: 1.18rem; font-weight: 600; color: var(--text-primary); line-height: 1.38; }
    .quiz-btn.correct {
      background: #FFF9EB; border: 3px solid var(--accent-gold);
      box-shadow: 0 0 0 3px rgba(212, 154, 61, 0.24), var(--shadow-card);
    }
    .quiz-btn.correct .quiz-letter { background: var(--accent-gold); color: #2A1A0A; }
    .quiz-btn.wrong { background: var(--accent-vermilion-bg); border-color: var(--accent-vermilion); opacity: 0.84; }
    .quiz-btn.wrong .quiz-letter { background: var(--accent-vermilion); color: #FDFBF7; }

    /* Smooth accordion reveal for Quiz Feedback & Q&A */
    .quiz-feedback-shell {
      display: grid; grid-template-rows: 1fr; transition: grid-template-rows 260ms var(--ease);
    }
    .quiz-feedback {
      background: var(--accent-gold-bg); border: 1.5px solid var(--accent-gold);
      border-radius: 14px; padding: 14px 20px; display: flex; align-items: center;
      justify-content: space-between; gap: 14px; min-height: 66px;
    }

    /* SLIDE 28–29 SMOOTH SLIDING ACCORDION */
    .qa-stack { display: flex; flex-direction: column; gap: 14px; flex: 1; justify-content: center; }
    .qa-item {
      background: var(--glass-card); border: 1.5px solid var(--border-subtle);
      border-radius: 16px; box-shadow: var(--shadow-card); overflow: hidden;
      transition: border-color 200ms var(--ease);
    }
    .qa-item.open { border-color: var(--accent-vermilion); }
    .qa-head-btn {
      width: 100%; padding: 15px 20px; display: flex; align-items: center;
      justify-content: space-between; gap: 14px; text-align: left;
      transition: background-color 180ms var(--ease);
    }
    .qa-head-btn:hover { background: rgba(245, 239, 235, 0.65); }
    .qa-tag {
      padding: 5px 10px; border-radius: 8px; background: var(--accent-vermilion-bg);
      color: var(--accent-vermilion-dark); font-size: 12px; font-weight: 800; white-space: nowrap; flex-shrink: 0;
    }
    .qa-q { font-size: 1.2rem; font-weight: 700; color: var(--text-chestnut); line-height: 1.42; }
    .qa-arrow {
      width: 38px; height: 38px; border-radius: 50%; background: var(--bg-sand);
      color: var(--text-chestnut); display: grid; place-items: center; flex-shrink: 0;
      transition: transform 240ms var(--ease), background-color 200ms var(--ease), color 200ms var(--ease);
    }
    .qa-item.open .qa-arrow { transform: rotate(180deg); background: var(--accent-vermilion); color: #FDFBF7; }

    .qa-body-outer {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 340ms var(--ease), opacity 260ms var(--ease);
    }
    .qa-item.open .qa-body-outer {
      max-height: 460px;
      opacity: 1;
    }
    .qa-body-inner { overflow: hidden; }
    .qa-answer-box {
      padding: 15px 22px 20px; border-top: 1px dashed var(--border-strong);
      background: rgba(252, 244, 228, 0.50); font-size: 1.14rem; line-height: 1.62; color: var(--text-primary);
    }
    .qa-speaker-tag {
      display: inline-block; font-size: 0.85rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--accent-gold-dark); margin-bottom: 6px;
    }

    .btn-secondary {
      min-height: 38px; padding: 7px 14px; border-radius: 10px;
      background: var(--bg-sand); border: 1px solid var(--border-strong);
      color: var(--text-chestnut); font-size: 13px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 6px;
      transition: background-color 180ms var(--ease), border-color 180ms var(--ease);
    }
    .btn-secondary:hover { background: #E9DEC9; border-color: var(--accent-gold); }

    /* ULTRA-SLIM EDGE PROGRESS HAIRLINE (0px LAYOUT FOOTPRINT) */
    .edge-progress {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: rgba(212, 195, 176, 0.35);
      cursor: pointer;
      z-index: 35;
      transition: height 180ms var(--ease);
    }
    .edge-progress:hover { height: 7px; }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-vermilion), var(--accent-gold));
      transition: width 260ms var(--ease);
    }

    /* FULLSCREEN MODE (:fullscreen & F11 / TRÌNH CHIẾU):
       KEEP HEADER VISIBLE • EXPAND SLIDE TO 96vw x 92vh • +15-20% TEXT • MIN-HEIGHT 500px PHOTOS */
    :fullscreen .top-bar,

      display: flex;

      background: rgba(253, 251, 247, 0.90);

    }

      height: 92vh;
      max-height: calc(100vh - 60px);
    }

    }

    :fullscreen .stepper-card-tag,

    :fullscreen .quiz-label,

    :fullscreen .timeline-step-range,

    :fullscreen .compact-photo .photo-frame,
    body.is-fullscreen .compact-photo .photo-frame { min-height: 360px; }
    :fullscreen .photo-frame img,

    .notes-drawer {
      position: fixed; left: 20px; right: 20px; bottom: 18px; max-width: 980px; margin: 0 auto;
      background: rgba(253, 251, 247, 0.98); border: 1.5px solid var(--border-strong);

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(26, 16, 8, 0.56); backdrop-filter: blur(4px);
      z-index: 50; display: none; align-items: center; justify-content: center; padding: 20px;

    .overview-grid { padding: 18px 22px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(225px, 1fr)); gap: 12px; }
    .thumb-card {
      background: #FFFFFF; border: 1.5px solid var(--border-subtle); border-radius: 13px;
      padding: 13px 15px; text-align: left; display: flex; flex-direction: column; gap: 5px;
      transition: border-color 180ms var(--ease), background-color 180ms var(--ease);

    @media (max-width: 960px) { .icon-btn:not(.btn-present) .btn-label { display: none; } .notes-body-grid { grid-template-columns: 1fr; } }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
    @media print {
      @page { size: 1440px 810px; margin: 0; }
      body { background: #FDFBF7 !important; overflow: visible !important; }
      .top-bar, .edge-progress, .notes-drawer, .modal-backdrop { display: none !important; }
      .stage-wrapper { padding: 0 !important; display: block !important; overflow: visible !important; }

        <svg id="fullscreenIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

      const isFs = apiFs || browserFs;
      document.body.classList.toggle('is-fullscreen', isFs);
      el.btnFullscreen.classList.toggle('active', isFs);
      el.fullscreenLabel.textContent = isFs ? 'Thoát toàn màn hình' : 'Trình chiếu';
      el.fullscreenIcon.innerHTML = isFs ? FS_EXIT_ICON : FS_ENTER_ICON;
      el.btnFullscreen.setAttribute('aria-label', isFs ? 'Thoát chế độ toàn màn hình (Phím F hoặc Esc)' : 'Trình chiếu toàn màn hình (Phím F)');
    }

    function fitCanvas() {
      syncFullscreenState();
      const isFs = document.body.classList.contains('is-fullscreen');
      const rect = el.stageWrapper.getBoundingClientRect();
      const targetW = isFs
        ? Math.max(Math.min(rect.width - 8, window.innerWidth * 0.96), 320)
        : Math.max(Math.min(rect.width - 10, window.innerWidth * 0.95), 320);
      const targetH = isFs
        ? Math.max(Math.min(rect.height - 6, window.innerHeight * 0.92), 200)
        : Math.max(Math.min(rect.height - 8, window.innerHeight * 0.91), 200);

      // Dynamic logical canvas fills exact 96vw x 92vh with zero excess beige borders
      const baseH = isFs ? 880 : 810;
      let scale = targetH / baseH;
      if (targetW / scale < 1300) {
        scale = targetW / 1300;
      }
      const logicalW = Math.round(targetW / scale);
      const logicalH = Math.round(targetH / scale);

      el.slideFrame.style.width = `${logicalW}px`;
      el.slideFrame.style.height = `${logicalH}px`;
      el.slideFrame.style.transform = `scale(${scale})`;
    }

    function bindTabSwitchers() {
      document.querySelectorAll('.tab-switcher-wrap').forEach(wrap => {
        const tabs = wrap.querySelectorAll('.tab-btn');
        const panels = wrap.querySelectorAll('.tab-panel');
        tabs.forEach(tab => {
          tab.addEventListener('click', () => {
            const targetId = tab.dataset.tabTarget;
            tabs.forEach(t => {
              const isActive = t === tab;
              t.classList.toggle('active', isActive);
              t.setAttribute('aria-selected', String(isActive));
            });
            panels.forEach(p => {
              p.classList.toggle('active', p.id === targetId);
            });
          });
        });
      });
    }

    function updateQuizUI() {
      const buttons = document.querySelectorAll('#quizStage .quiz-btn');
      const feedbackText = document.getElementById('quizFeedbackText');
      if (!buttons.length || !feedbackText) return;

      buttons.forEach(btn => {
        btn.classList.remove('correct', 'wrong');
        const choice = btn.dataset.choice;
        if (state.quizChoice) {
          if (choice === 'B') btn.classList.add('correct');
          else if (choice === state.quizChoice) btn.classList.add('wrong');
        }
      });

      if (!state.quizChoice) {
        feedbackText.innerHTML = 'Bấm chọn một phương án (A, B, C hoặc D) để hiển thị đáp án đúng nổi bật viền vàng rơm!';
      } else if (state.quizChoice === 'B') {
        feedbackText.innerHTML = '<strong>Chính xác tuyệt đối!</strong> Đáp án nổi bật viền vàng rơm là <strong>B — “Em bé chăn trâu được chọn làm Chánh bái nhí”</strong> — người duy nhất bước lên chiếu hoa chủ trì đại lễ tế Thần Nông.';
      } else {
        feedbackText.innerHTML = '<strong>Chưa chính xác!</strong> Đáp án đúng nổi bật viền vàng rơm là <strong>B — “Em bé chăn trâu được chọn làm Chánh bái nhí”</strong> — nét nhân văn độc bản nhất của làng Phong Lệ.';
      }
    }

    function bindSlide21Events() {
      document.querySelectorAll('#quizStage .quiz-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.quizChoice = btn.dataset.choice;
          updateQuizUI();
        });
      });
      const resetBtn = document.getElementById('btnResetQuiz');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          state.quizChoice = null;
          updateQuizUI();
        });
      }
      updateQuizUI();
    }

    function updateNavButtons() {
      // Navigation is driven purely by keyboard (ArrowRight/ArrowLeft/Space/PageUp/PageDown), click, and touch swipe.
    }

    function bindSteppers(startAtLastStep = false) {
      state.stepper = null;
      const container = el.slideContent.querySelector('[data-stepper]');
      if (!container) {
        updateNavButtons();
        return;
      }

      const cards = Array.from(container.querySelectorAll('.stepper-card'));
      const mediaItems = Array.from(container.querySelectorAll('.stepper-media-item'));
      if (!cards.length) {
        updateNavButtons();
        return;
      }

      const controller = {
        activeIdx: startAtLastStep ? cards.length - 1 : 0,
        total: cards.length,
        setStep(idx) {
          const clamped = Math.max(0, Math.min(cards.length - 1, idx));
          this.activeIdx = clamped;
          cards.forEach((c, i) => {
            const on = i === clamped;
            c.classList.toggle('active', on);
            c.setAttribute('aria-selected', String(on));
          });
          mediaItems.forEach((m, i) => {
            m.classList.toggle('active', i === clamped);
          });
          updateNavButtons();
        }
      };

      cards.forEach((c, i) => c.addEventListener('click', e => {
        e.stopPropagation();
        controller.setStep(i);
      }));

      state.stepper = controller;
      controller.setStep(controller.activeIdx);
    }

    function bindAccordionEvents(startAtLastStep = false) {
      const items = Array.from(el.slideContent.querySelectorAll('.qa-item'));
      if (!items.length) return;

      const controller = {
        activeIdx: startAtLastStep ? items.length : 0,
        total: items.length + 1, // 0 = all closed, 1 = Q1 open, 2 = Q1+Q2 open...
        setStep(step) {
          const clamped = Math.max(0, Math.min(items.length, step));
          this.activeIdx = clamped;
          items.forEach((item, i) => {
            const shouldOpen = i < clamped;
            item.classList.toggle('open', shouldOpen);
            const btn = item.querySelector('.qa-head-btn');
            if (btn) btn.setAttribute('aria-expanded', String(shouldOpen));
          });
          updateNavButtons();
        }
      };

      items.forEach(item => {
        const btn = item.querySelector('.qa-head-btn');
        if (!btn) return;
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const isOpen = item.classList.toggle('open');
          btn.setAttribute('aria-expanded', String(isOpen));
          // Sync sub-step index with highest open question so Next/Prev stay intuitive
          let highestOpen = 0;
          items.forEach((it, idx) => {
            if (it.classList.contains('open')) highestOpen = idx + 1;
          });
          controller.activeIdx = highestOpen;
          updateNavButtons();
        });
      });

      state.stepper = controller;
      controller.setStep(controller.activeIdx);
    }

    function renderSlide(index, options = {}) {
      state.currentIndex = Math.max(0, Math.min(SLIDES.length - 1, index));
      const slide = SLIDES[state.currentIndex];
      const total = SLIDES.length;
      const numStr = `${pad2(slide.num)} / ${pad2(total)}`;

      el.slideContent.style.animation = 'none';
      el.slideContent.offsetHeight;
      el.slideContent.style.animation = '';
      el.slideContent.innerHTML = slide.render();

      el.slideFooterCounter.textContent = `SLIDE ${numStr}`;
      el.progressFill.style.width = `${(slide.num / total) * 100}%`;
      el.progressTrack.setAttribute('aria-valuenow', String(slide.num));

      el.notesText.textContent = slide.speakerNotes;
      el.notesLayout.textContent = slide.layoutDesc;

      const atLast = Boolean(options.startAtLastStep);
      bindTabSwitchers();
      bindSteppers(atLast);
      el.slideContent.querySelectorAll('[data-jump-slide]').forEach(btn => {
        btn.addEventListener('click', () => renderSlide(Number(btn.dataset.jumpSlide)));
      });
      if (el.slideContent.querySelector('#quizStage')) bindSlide21Events();
      if (el.slideContent.querySelector('.qa-item')) bindAccordionEvents(atLast);
    }

    function goNext() {
      if (state.stepper && state.stepper.activeIdx < state.stepper.total - 1) {
        state.stepper.setStep(state.stepper.activeIdx + 1);
        return;
      }
      if (state.currentIndex < SLIDES.length - 1) {
        renderSlide(state.currentIndex + 1, { startAtLastStep: false });
      }
    }

    function goPrev() {
      if (state.stepper && state.stepper.activeIdx > 0) {
        state.stepper.setStep(state.stepper.activeIdx - 1);
        return;
      }
      if (state.currentIndex > 0) {
        renderSlide(state.currentIndex - 1, { startAtLastStep: true });
      }
    }

    function buildOverviewGrid() {
      el.overviewGrid.innerHTML = SLIDES.map((s, idx) => `
        <button type="button" class="thumb-card ${idx === state.currentIndex ? 'active' : ''}" data-idx="${idx}">
          <span style="font-size:11.5px;font-weight:800;color:var(--accent-vermilion);">SLIDE ${pad2(s.num)}</span>
          <span style="font-size:13.8px;font-weight:700;color:var(--text-chestnut);line-height:1.35;">${s.title}</span>
          <span style="font-size:11.5px;color:var(--text-subtle);">${s.part}</span>
        </button>
      `).join('');

      el.overviewGrid.querySelectorAll('.thumb-card').forEach(card => {
        card.addEventListener('click', () => {
          renderSlide(Number(card.dataset.idx));
          el.overviewModal.classList.remove('open');
        });
      });
    }

    function buildScriptSheet() {
      el.scriptSheet.innerHTML = SLIDES.map((s, idx) => `
        <div class="script-entry">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
            <strong style="font-size:15.5px;color:var(--text-chestnut);">SLIDE ${pad2(s.num)}: ${s.title}</strong>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="chip sand">${s.part}</span>
              <button type="button" class="btn-secondary" style="min-height:32px;padding:4px 10px;font-size:12px;" data-jump="${idx}">Mở slide</button>
            </div>
          </div>
          <div style="font-size:13.8px;color:var(--text-muted);line-height:1.5;"><strong>Visual &amp; Tương tác:</strong> ${s.layoutDesc}</div>
          <div style="font-size:14px;color:var(--text-primary);line-height:1.52;">
            <strong>Nội dung thẻ chữ:</strong>
            <ul style="margin:4px 0 0 18px;">${s.bulletsSummary.map(b => `<li>${b}</li>`).join('')}</ul>
          </div>
          <div style="font-size:14px;color:var(--text-chestnut);background:var(--bg-sand);padding:10px 12px;border-radius:10px;line-height:1.55;">
            <strong>Speaker Notes:</strong> ${s.speakerNotes}
          </div>
        </div>
      `).join('');

      el.scriptSheet.querySelectorAll('[data-jump]').forEach(btn => {
        btn.addEventListener('click', () => {
          renderSlide(Number(btn.dataset.jump));
          el.scriptModal.classList.remove('open');
        });
      });
    }

    function toggleNotes(force) {
      state.notesOpen = typeof force === 'boolean' ? force : !state.notesOpen;
      el.notesDrawer.classList.toggle('open', state.notesOpen);
      el.btnNotes.classList.toggle('active', state.notesOpen);
      el.btnNotes.setAttribute('aria-pressed', String(state.notesOpen));
    }

    function toggleFullscreen() {
      const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
      if (!fsEl) {
        const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
        req?.call(document.documentElement)?.catch?.(() => {});
      } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        exit?.call(document)?.catch?.(() => {});
      }
    }

    el.btnNotes.addEventListener('click', () => toggleNotes());
    el.btnCloseNotes.addEventListener('click', () => toggleNotes(false));

    el.btnOverview.addEventListener('click', () => { buildOverviewGrid(); el.overviewModal.classList.add('open'); });
    el.btnCloseOverview.addEventListener('click', () => el.overviewModal.classList.remove('open'));
    el.overviewModal.addEventListener('click', e => { if (e.target === el.overviewModal) el.overviewModal.classList.remove('open'); });

    el.btnScript.addEventListener('click', () => { buildScriptSheet(); el.scriptModal.classList.add('open'); });
    el.btnCloseScript.addEventListener('click', () => el.scriptModal.classList.remove('open'));
    el.scriptModal.addEventListener('click', e => { if (e.target === el.scriptModal) el.scriptModal.classList.remove('open'); });

    el.btnFullscreen.addEventListener('click', toggleFullscreen);

    // PowerPoint-style click on empty slide area advances sub-step / next slide
    el.slideFrame.addEventListener('click', e => {
      if (window.getSelection?.().toString()) return;
      if (e.target.closest('button, a, video, iframe, input, textarea, [role="tab"]')) return;
      goNext();
    });

    el.progressTrack.addEventListener('click', e => {
      const rect = el.progressTrack.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      renderSlide(Math.min(SLIDES.length - 1, Math.floor(ratio * SLIDES.length)));
    });

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'Escape') {
        el.overviewModal.classList.remove('open');
        el.scriptModal.classList.remove('open');
        return;
      }
      if (el.overviewModal.classList.contains('open') || el.scriptModal.classList.contains('open')) return;

      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); goNext(); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goPrev(); }
      else if (e.key === 'Home') { e.preventDefault(); renderSlide(0); }
      else if (e.key === 'End') { e.preventDefault(); renderSlide(SLIDES.length - 1); }
      else if (e.key.toLowerCase() === 'n') toggleNotes();
      else if (e.key.toLowerCase() === 'g') { buildOverviewGrid(); el.overviewModal.classList.add('open'); }
      else if (e.key.toLowerCase() === 's') { buildScriptSheet(); el.scriptModal.classList.add('open'); }
      else if (e.key.toLowerCase() === 'f') toggleFullscreen();
    });

    let touchStartX = 0;
    el.stageWrapper.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
    el.stageWrapper.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 48) {
        if (dx < 0) goNext();
        else goPrev();
      }
    }, { passive: true });

    window.addEventListener('resize', fitCanvas);
    const onFsChange = () => {
      syncFullscreenState();
      requestAnimationFrame(() => requestAnimationFrame(fitCanvas));
    };
    document.addEventListener('fullscreenchange', onFsChange);
    document.addEventListener('webkitfullscreenchange', onFsChange);
    if (typeof ResizeObserver !== 'undefined') new ResizeObserver(fitCanvas).observe(el.stageWrapper);

    renderSlide(0);
    fitCanvas();
  </script>
</body>
</html>
